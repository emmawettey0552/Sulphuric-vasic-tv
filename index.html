    <div class="wrapper">
        <span class="icon-close"><ion-icon name="close"></ion-icon>

        <div class="form-box login">
            <h2>Login</h2>
            <form action="#">
                </div>
                <div class="input-box">
                    <span class="icon"><ion-icon name="lock-closed"></ion-icon></span>

        <div class="wrapper">
            <span class="icon-close"><ion-icon name="close"></ion-icon>
            </span>

        <div class="form-box register">

                </div>

                    <p>Already have an account?<a href="#" class="login-register">Login</a></p>
                </div>
            </form>
        </div>
